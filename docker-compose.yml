version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: medical_training_postgres
    environment:
      POSTGRES_DB: medical-project
      POSTGRES_USER: redflag_user
      POSTGRES_PASSWORD: redflag_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - medical_training_network

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: medical_training_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - medical_training_network

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medical_training_backend
    ports:
      - "4005:4005"
    environment:
      - NODE_ENV=development
      - PORT=4005
      - DATABASE_URL=postgresql://redflag_user:redflag_password@postgres:5432/medical-project?schema=public
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGIN=http://localhost:4001
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis
    networks:
      - medical_training_network
    command: npm run start:dev

  # Client Frontend Service
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: medical_training_client
    ports:
      - "4001:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:4005/api

    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - medical_training_network
    command: npm start

  # Admin Panel Service
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: medical_training_admin
    ports:
      - "4002:4002"
    environment:
      - VITE_API_URL=http://localhost:4005/api
      - PORT=4002
    volumes:
      - ./admin:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - medical_training_network
    command: npm run dev

volumes:
  postgres_data:
  redis_data:

networks:
  medical_training_network:
    driver: bridge
