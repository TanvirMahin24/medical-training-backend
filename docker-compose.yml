version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: medical_training_postgres
    environment:
      POSTGRES_DB: medical_training_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - medical_training_network

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: medical_training_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - medical_training_network

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medical_training_backend
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/medical_training_db
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis
    networks:
      - medical_training_network
    command: npm run start:dev

  # Client Frontend Service
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: medical_training_client
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:3002
      - REACT_APP_ADMIN_URL=http://localhost:3001
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - medical_training_network
    command: npm start

  # Admin Panel Service
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: medical_training_admin
    ports:
      - "3001:3001"
    environment:
      - VITE_API_URL=http://localhost:3002
    volumes:
      - ./admin:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - medical_training_network
    command: npm run dev

volumes:
  postgres_data:
  redis_data:

networks:
  medical_training_network:
    driver: bridge
